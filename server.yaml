apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-crud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-crud
  template:
    metadata:
      labels:
        app: go-crud
    spec:
      containers:
      - name: go-crud
        image: bekinggo/servidor:latest
        ports:
        - containerPort: 8080

        env:
        - name: REDIS_HOST
          value: "10.97.123.131:6379"
        - name: MONGO_URI
          value: "mongodb://mongodb:27017"

---
apiVersion: v1
kind: Service
metadata:
  name: go-crud-service
spec:
  selector:
    app: go-crud
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer

